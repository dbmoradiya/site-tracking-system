<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldwork · Employee preview</title><style>*{box-sizing:border-box}body{margin:0;background:#EAF0F7;color:#162B35;font:16px system-ui,sans-serif}.review{max-width:760px;margin:20px auto;text-align:center;font-size:14px;color:#536976}.review a{color:#175CD3;margin:0 8px}.phone{max-width:412px;margin:20px auto 32px;background:#F7F9FC;box-shadow:0 20px 65px #162B3516;border-radius:32px;overflow:hidden}.phone svg{display:block;width:100%;height:auto}#error{display:none;padding:32px}a:focus-visible{outline:3px solid #175CD3;outline-offset:3px}@media(max-width:500px){body{background:#F7F9FC}.review{margin:10px 0;font-size:12px}.phone{margin:0 auto;box-shadow:none;border-radius:0}}@media(prefers-reduced-motion:no-preference){.phone{animation:enter .18s ease-out}@keyframes enter{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}}</style></head><body><div class="review"><a href="#M04">English</a><a href="#M45">हिन्दी</a><a href="#M46">ગુજરાતી</a> · <a href="index.html#M06">All designs</a></div><main class="phone" id="phone" aria-label="Employee app design"></main><p id="error">Could not open this design. Please reload.</p><p class="review">Design prototype · sample photos and recordings</p><script type="module">const manifest=await(await fetch('review-manifest.json')).json();const screens=new Map(manifest.screens.filter(s=>s.platform==='mobile').map(s=>[s.id,s]));const fontStyle=document.createElement('style');fontStyle.textContent=`@font-face{font-family:sourcesanspro;src:url('fonts/SourceSansPro-Regular.woff2');font-weight:400}@font-face{font-family:sourcesanspro;src:url('fonts/SourceSansPro-Semibold.woff2');font-weight:600}@font-face{font-family:sourcesanspro;src:url('fonts/SourceSansPro-Bold.woff2');font-weight:700}@font-face{font-family:'Noto Sans Devanagari';src:url('fonts/NotoSansDevanagari.ttf')}@font-face{font-family:'Noto Sans Gujarati';src:url('fonts/NotoSansGujarati.ttf')}`;document.head.append(fontStyle);async function show(){const id=screens.has(location.hash.slice(1))?location.hash.slice(1):'M46';const screen=screens.get(id);const svg=(await(await fetch('screens/'+id+'.svg')).text()).replace(/<style>[\s\S]*?<\/style>/,'');document.querySelector('#phone').innerHTML=svg;document.documentElement.lang=screen.locale||'en';document.title='Fieldwork · '+screen.title;window.scrollTo(0,0);}window.addEventListener('hashchange',()=>show().catch(()=>document.querySelector('#error').style.display='block'));await show();</script></body></html>
