-weight="400" fill="#626578" style="pointer-events:none"><tspan x="264" dy="0">Validate stage version and assignment version atomically. Preserve accepted pending attempts; no rewriting by the new owner. This branch illustrates handover; prototype</tspan><tspan x="264" dy="17.55">mutations are not persisted.</tspan></text><a href="#A08" data-to="A08" aria-label="Action / Confirm handover"><rect data-node="4132f1b2-096b-44f3-97fa-493cb7a45527" x="264" y="530.5" width="164" height="44" rx="9" fill="#6246C7"  /></a><text data-node="70910c6e-eb47-4f38-9ef3-2db74405f57c" data-box-width="136" x="278" y="557.5" font-family="sourcesanspro" font-size="15" font-weight="600" fill="#FFFFFF" style="pointer-events:none"><tspan x="278" dy="0">Confirm handover</tspan></text><a href="#A81" data-to="A81" aria-label="Action / Cancel"><rect data-node="f11e6b18-feea-4c19-8369-5a3db45e5635" x="440" y="530.5" width="154" height="44" rx="9" fill="#FFFFFF"  stroke="#E5E6EF"/></a><text data-node="cb00763c-d8d7-486b-9cff-620b89d49365" data-box-width="126" x="454" y="557.5" font-family="sourcesanspro" font-size="15" font-weight="600" fill="#24233B" style="pointer-events:none"><tspan x="454" dy="0">Cancel</tspan></text></svg>