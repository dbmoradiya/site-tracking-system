o" font-size="15" font-weight="400" fill="#626578" style="pointer-events:none"><tspan x="264" dy="0">Only this stage changes. Ravi remains site coordinator.</tspan></text><rect data-node="037e2e21-0feb-410a-8ae9-6df6919b206e" x="264" y="190.05" width="1136" height="54.25" rx="10" fill="#FFF5DF" style="pointer-events:none" stroke="#EEDDAD"/><text data-node="917f3303-3450-43b2-8995-4124b7ef1209" data-box-width="1096" x="284" y="220.05" font-family="sourcesanspro" font-size="15" font-weight="400" fill="#855D0E" style="pointer-events:none"><tspan x="284" dy="0">Accepted submissions stay reviewable under their original author. Unsynced work from the former assignment will need checking.</tspan></text><rect data-node="743115ef-c0ae-41cf-b333-3966f096c397" x="252" y="250.3" width="1160" height="10" rx="0" fill="#F6F7FB" style="pointer-events:none" /><text data-node="13258f54-2d9b-4cbe-9101-88486cfdca01" data-box-width="554" x="264" y="275.3" font-family="sourcesanspro" font-size="13" font-weight="600" fill="#626578" style="pointer-events:none"><tspan x="264" dy="0">Current person</tspan></text><rect data-node="d965f5a6-5c16-4924-9ad0-ff538671c260" x="264" y="288.85" width="554" height="48" rx="9" fill="#EEF1EC" style="pointer-events:none" stroke="#E5E6EF"/><text data-node="ef40a9e6-d23c-4c8c-b2fa-e9186fca370a" data-box-width="520" x="278" y="316.85" font-family="sourcesanspro" font-size="16" font-weight="400" fill="#24233B" style="pointer-events:none"><tspan x="278" dy="0">Ravi Patel</tspan></text><text data-node="02ad649c-22e8-40c1-b584-fddaf646303d" data-box-width="554" x="846" y="275.3" font-family="sourcesanspro" font-size="13" font-weight="600" fill="#626578" style="pointer-events:none"><tspan x="846" dy="0">New person</tspan></text><rect data-node="00e8e2db-8e68-4b19-bf98-8bd3443a2157" x="846" y="288.85" width="554" height="48" rx="9" fill="#FFFFFF" style="pointer-events:none" stroke="#E5E6EF"/><text data-node="f9605908-c196-4813-925f-72fa817f608a" data-box-width="47