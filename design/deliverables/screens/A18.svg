pro" font-size="15" font-weight="400" fill="#626578" style="pointer-events:none"><tspan x="264" dy="0">Location is required when a site photo is added.</tspan></text><rect data-node="0ec511f0-ea7c-4319-bf73-8236558322a7" x="264" y="190.05" width="1136" height="54.25" rx="10" fill="#FFF5DF" style="pointer-events:none" stroke="#EEDDAD"/><text data-node="5f986842-99a9-4e89-87c4-4534f780f4bd" data-box-width="1096" x="284" y="220.05" font-family="sourcesanspro" font-size="15" font-weight="400" fill="#855D0E" style="pointer-events:none"><tspan x="284" dy="0">Allow browser location to attach this photo. Gallery EXIF and the site address do not replace a live device position.</tspan></text><rect data-node="2fc6a36a-4ccc-4fc7-8876-4c1d550e6243" x="264" y="262.3" width="1136" height="123.85" rx="13" fill="#FFFFFF" style="pointer-events:none" stroke="#E5E6EF"/><text data-node="a406e8df-a779-4ffa-99cb-9a72a40f2cb6" data-box-width="1084" x="284" y="299.3" font-family="sourcesanspro" font-size="17" font-weight="600" fill="#24233B" style="pointer-events:none"><tspan x="284" dy="0">Location permission required</tspan></text><text data-node="456b1e83-83ae-408a-891f-8cfb5f82141a" data-box-width="1084" x="284" y="325.25" font-family="sourcesanspro" font-size="14" font-weight="400" fill="#626578" style="pointer-events:none"><tspan x="284" dy="0">A fresh fix will be stored with each selected photo.</tspan></text><rect data-node="350dd433-3cd9-40b6-ae62-9bc7cf475b2b" x="284" y="338.15" width="74.8" height="26" rx="7" fill="#FCEEF0" style="pointer-events:none" /><text data-node="125e4108-5323-40b8-9a0a-d2e707340856" data-box-width="56.8" x="294" y="354.15" font-family="sourcesanspro" font-size="12" font-weight="600" fill="#B13843" style="pointer-events:none"><tspan x="294" dy="0">Required</tspan></text><rect data-node="68afb4ef-a102-4aef-8ec8-6b4efa44e944" x="264" y="396.15" width="1136" height="123.85" rx="13" fill="#FFFFFF" style="pointer-events:none" stroke="#E5E6EF"/><text data-node="