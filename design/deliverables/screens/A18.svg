pro" font-size="15" font-weight="400" fill="#626578" style="pointer-events:none"><tspan x="264" dy="0">Location is required when a site photo is added.</tspan></text><rect data-node="4a4d0caf-9d5c-450d-9985-17bc8d196eee" x="264" y="190.05" width="1136" height="54.25" rx="10" fill="#FFF5DF" style="pointer-events:none" stroke="#EEDDAD"/><text data-node="bfab76bf-2988-41f2-b9ac-3212ddec9477" data-box-width="1096" x="284" y="220.05" font-family="sourcesanspro" font-size="15" font-weight="400" fill="#855D0E" style="pointer-events:none"><tspan x="284" dy="0">Allow browser location to attach this photo. Gallery EXIF and the site address do not replace a live device position.</tspan></text><rect data-node="61568819-f9a3-4cbd-880f-e0901147aefe" x="264" y="262.3" width="1136" height="123.85" rx="13" fill="#FFFFFF" style="pointer-events:none" stroke="#E5E6EF"/><text data-node="21b1393e-ec9e-40f5-ac4d-4bbf2ee4bc6d" data-box-width="1084" x="284" y="299.3" font-family="sourcesanspro" font-size="17" font-weight="600" fill="#24233B" style="pointer-events:none"><tspan x="284" dy="0">Location permission required</tspan></text><text data-node="5e85af9f-190e-479b-9e1d-fec34ae5cc0c" data-box-width="1084" x="284" y="325.25" font-family="sourcesanspro" font-size="14" font-weight="400" fill="#626578" style="pointer-events:none"><tspan x="284" dy="0">A fresh fix will be stored with each selected photo.</tspan></text><rect data-node="2c878fb4-af3a-4318-8957-2f7fd141e782" x="284" y="338.15" width="74.8" height="26" rx="7" fill="#FCEEF0" style="pointer-events:none" /><text data-node="f3c18e7f-04bf-487d-8015-77cddbb567c7" data-box-width="56.8" x="294" y="354.15" font-family="sourcesanspro" font-size="12" font-weight="600" fill="#B13843" style="pointer-events:none"><tspan x="294" dy="0">Required</tspan></text><rect data-node="28b6ad7d-f51b-4636-a221-62e7685d0fb9" x="264" y="396.15" width="1136" height="123.85" rx="13" fill="#FFFFFF" style="pointer-events:none" stroke="#E5E6EF"/><text data-node="