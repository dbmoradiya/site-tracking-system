# Production profile: SPRING_PROFILES_ACTIVE=prod
server:
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

app:
  # No defaults in production: these must be provided by the environment.
  jwt-secret: ${APP_JWT_SECRET}
  upload-dir: ${APP_UPLOAD_DIR:/data/uploads}
  allowed-origin-patterns: ${APP_ALLOWED_ORIGIN_PATTERNS}
  bootstrap-admin:
    mobile: ${APP_BOOTSTRAP_ADMIN_MOBILE:}
    name: ${APP_BOOTSTRAP_ADMIN_NAME:Administrator}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    clear-demo-data: ${APP_BOOTSTRAP_CLEAR_DEMO_DATA:false}

logging:
  level:
    root: INFO
