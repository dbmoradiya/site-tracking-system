# Production profile: SPRING_PROFILES_ACTIVE=prod
server:
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  flyway:
    locations: classpath:db/migration,classpath:db/prod
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

app:
  # No defaults in production: these must be provided by the environment.
  jwt-secret: ${APP_JWT_SECRET}
  upload-dir: ${APP_UPLOAD_DIR:/data/uploads}
  allowed-origin-patterns: ${APP_ALLOWED_ORIGIN_PATTERNS}
  bootstrap-admin:
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    name: ${APP_BOOTSTRAP_ADMIN_NAME:Administrator}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
