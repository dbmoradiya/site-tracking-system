services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sitetrack
      POSTGRES_USER: sitetrack
      POSTGRES_PASSWORD: sitetrack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitetrack -d sitetrack"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/sitetrack
      DB_USERNAME: sitetrack
      DB_PASSWORD: sitetrack
      APP_JWT_SECRET: change-this-development-secret-before-production
      APP_UPLOAD_DIR: /data/uploads
      APP_ADMIN_MOBILE: ${APP_ADMIN_MOBILE:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_ALLOWED_ORIGIN_PATTERNS: ${APP_ALLOWED_ORIGIN_PATTERNS:-http://localhost:5173,http://localhost:8080,https://*.ngrok-free.app,https://*.ngrok.app,https://*.ngrok.io}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"
    volumes:
      - upload_data:/data/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
  upload_data:
